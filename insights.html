<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanGuard Insights Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0f;
      color: #f1f5f9;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #22c55e;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    
    .stat-card.highlight {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.05) 100%);
      border-color: #22c55e;
    }
    
    .stat-label {
      color: #64748b;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 42px;
      font-weight: 800;
      color: #22c55e;
      margin-bottom: 4px;
    }
    
    .stat-unit {
      color: #94a3b8;
      font-size: 14px;
    }
    
    .chart-container {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    
    .chart-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #f1f5f9;
    }
    
    .progress-bar {
      background: #1e293b;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .progress-fill {
      background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
      height: 100%;
      transition: width 0.3s ease;
    }
    
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .timeline-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(34, 197, 94, 0.05);
      border-left: 3px solid #22c55e;
      border-radius: 4px;
    }
    
    .timeline-icon {
      font-size: 20px;
      min-width: 30px;
    }
    
    .timeline-content {
      flex: 1;
    }
    
    .timeline-label {
      color: #94a3b8;
      font-size: 12px;
    }
    
    .timeline-value {
      color: #f1f5f9;
      font-weight: 600;
    }
    
    .motivational {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: white;
      margin-top: 40px;
    }
    
    .motivational h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .motivational p {
      opacity: 0.9;
      line-height: 1.6;
    }
    
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span style="font-size: 28px;">🛡️</span>
      <h1>Insights Dashboard</h1>
    </header>

    <!-- Main Stats -->
    <div class="stats-grid">
      <div class="stat-card highlight">
        <div class="stat-label">Current Streak</div>
        <div class="stat-value" id="streakDays">0</div>
        <div class="stat-unit">days 🔥</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-label">Total Blocked</div>
        <div class="stat-value" id="totalBlocked">0</div>
        <div class="stat-unit">attempts</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-label">Success Rate</div>
        <div class="stat-value" id="successRate">0</div>
        <div class="stat-unit">%</div>
      </div>
    </div>

    <!-- This Week's Progress -->
    <div class="chart-container">
      <div class="chart-title">This Week's Progress</div>
      <div class="timeline" id="weekTimeline">
        <div class="empty">Loading your data...</div>
      </div>
    </div>

    <!-- Milestones -->
    <div class="chart-container">
      <div class="chart-title">🎯 Milestones Reached</div>
      <div id="milestones">
        <div class="empty">Start your streak to unlock milestones!</div>
      </div>
    </div>

    <!-- Motivational Message -->
    <div class="motivational">
      <h2 id="motivationalTitle">Keep Going! 💪</h2>
      <p id="motivationalText">Every day of progress is a win. You're building real strength.</p>
    </div>
  </div>

  <script>
    async function loadInsights() {
      return new Promise((resolve) => {
        chrome.storage.local.get([
          "streakStart",
          "totalBlockedAttempts",
          "enabled",
          "lastActiveDay"
        ], (data) => {
          resolve(data);
        });
      });
    }

    async function displayInsights() {
      const data = await loadInsights();
      
      if (!data.streakStart) {
        document.querySelector(".stats-grid").innerHTML = `
          <div class="stat-card" style="grid-column: 1/-1;">
            <div class="empty-icon">🌱</div>
            <h2>Start Your Journey</h2>
            <p>Enable protection in CleanGuard to begin tracking your progress</p>
          </div>
        `;
        return;
      }

      // Calculate streak
      const streakDays = Math.max(0, Math.floor((Date.now() - data.streakStart) / (1000 * 60 * 60 * 24)));
      const blockedCount = data.totalBlockedAttempts || 0;

      // Update main stats
      document.getElementById("streakDays").textContent = streakDays;
      document.getElementById("totalBlocked").textContent = blockedCount;
      
      // Calculate success rate (blocked attempts prevented access)
      const successRate = blockedCount > 0 ? 100 : (streakDays > 0 ? 95 : 0);
      document.getElementById("successRate").textContent = successRate;

      // Generate week timeline
      const weekTimeline = document.getElementById("weekTimeline");
      const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const weekHtml = days.map((day, idx) => {
        const isToday = idx === new Date().getDay() - 1 || idx === 6;
        const isActive = streakDays >= (7 - idx);
        return `
          <div class="timeline-item">
            <div class="timeline-icon">${isActive ? "✓" : "○"}</div>
            <div class="timeline-content">
              <div class="timeline-label">${day}</div>
              <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${isActive ? "100" : "0"}%"></div>
                  </div>
                </div>
                <span style="color: #64748b; font-size: 12px;">${isActive ? "Protected" : "—"}</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
      weekTimeline.innerHTML = weekHtml;

      // Generate milestones
      const milestones = document.getElementById("milestones");
      const milestonesList = [];
      
      if (streakDays >= 1) milestonesList.push("🌱 Day 1 — You started your journey!");
      if (streakDays >= 7) milestonesList.push("📈 Week 1 — Seven days of strength!");
      if (streakDays >= 30) milestonesList.push("🏆 30 Days — You're unstoppable!");
      if (streakDays >= 90) milestonesList.push("👑 90 Days — A true champion!");
      if (streakDays >= 365) milestonesList.push("🌟 1 Year — You changed your life!");

      if (milestonesList.length === 0) {
        milestones.innerHTML = '<div class="empty">Complete day 1 to unlock your first milestone!</div>';
      } else {
        milestones.innerHTML = milestonesList.map(m => `
          <div class="timeline-item">
            <div class="timeline-icon">✨</div>
            <div class="timeline-content">
              <div class="timeline-value">${m}</div>
            </div>
          </div>
        `).join("");
      }

      // Update motivational message
      const motivationalMessages = [
        { title: "Keep Going! 💪", text: "Every day of progress is a win. You're building real strength." },
        { title: "You've Got This! 🔥", text: `${streakDays} days of resilience. That's incredible!` },
        { title: "Stay Strong! 🛡️", text: "Each moment you resist makes you stronger. Don't give up now." },
        { title: "Future You Thanks You! ✨", text: "The person you'll become thanks you for these decisions today." },
      ];
      
      const msg = motivationalMessages[streakDays % motivationalMessages.length];
      document.getElementById("motivationalTitle").textContent = msg.title;
      document.getElementById("motivationalText").textContent = msg.text;
    }

    // Load on page open
    displayInsights();
    
    // Refresh every 30 seconds
    setInterval(displayInsights, 30000);
  </script>
</body>
</html>
