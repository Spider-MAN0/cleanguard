<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanGuard — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #f1f5f9;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .shield { font-size: 52px; margin-bottom: 8px; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      background: #0a0a0f;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #64748b;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: #22c55e;
      color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #0a0a0f;
      border: 1px solid #1e293b;
      border-radius: 10px;
      color: #f1f5f9;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: #22c55e; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #22c55e;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: #16a34a; }
    .btn-primary:disabled { background: #166534; opacity: 0.6; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #334155;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #1e293b;
    }

    .btn-google {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1px solid #1e293b;
      border-radius: 12px;
      color: #f1f5f9;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .btn-google:hover { border-color: #22c55e; background: rgba(34,197,94,0.05); }

    .google-icon {
      width: 18px; height: 18px;
    }

    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .success-msg {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .footer-note {
      font-size: 12px;
      color: #475569;
      margin-top: 24px;
      line-height: 1.6;
    }

    .footer-note a { color: #22c55e; text-decoration: none; }

    .loading { display: none; }
    .loading.show { display: inline-block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>CleanGuard</h1>
    <p class="subtitle">Sign in to sync your streak, unlock premium features, and protect across all your devices.</p>

    <div class="tabs">
      <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
      <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <!-- Sign In Form -->
    <div id="signinForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="siEmail" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="siPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="btnSignIn" onclick="handleSignIn()">
        Sign In
      </button>
    </div>

    <!-- Sign Up Form -->
    <div id="signupForm" style="display:none">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="suEmail" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="suPassword" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="btnSignUp" onclick="handleSignUp()">
        Create Account
      </button>
    </div>

    <div class="divider">or</div>

    <button class="btn-google" onclick="handleGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <p class="footer-note">
      By signing in you agree to our <a href="/privacy.html">Privacy Policy</a>.<br>
      A product of Spider Corp.
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
             GoogleAuthProvider, signInWithPopup }
      from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABKGu9feYP7eK-dFI4DDLR29SqM_bHDLA",
      authDomain: "cleanguard-493c2.firebaseapp.com",
      projectId: "cleanguard-493c2",
      storageBucket: "cleanguard-493c2.firebasestorage.app",
      messagingSenderId: "272685327976",
      appId: "1:272685327976:web:0eca56c6c9a6fe4dbe7ddd"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── Do NOT auto-login — user must manually sign in each time ──
    // onAuthStateChanged removed intentionally to prevent automatic login

    // ── Create/update user doc in Firestore ──
    async function ensureUserDoc(user) {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || "",
          plan: "free",
          streakDays: 0,
          streakStart: null,
          totalBlocked: 0,
          createdAt: serverTimestamp(),
          lastSeen: serverTimestamp(),
        });
      } else {
        await setDoc(ref, { lastSeen: serverTimestamp() }, { merge: true });
      }
      return (await getDoc(ref)).data();
    }

    // ── Send auth token back to extension ──
    async function handleAuthSuccess(user) {
      const userData = await ensureUserDoc(user);
      const token = await user.getIdToken();

      showSuccess("Signed in! Connecting to CleanGuard...");

      // Send token back to extension via postMessage
      window.opener?.postMessage({
        type: "CLEANGUARD_AUTH_SUCCESS",
        token,
        uid: user.uid,
        email: user.email,
        plan: userData.plan || "free",
        streakDays: userData.streakDays || 0,
      }, "*");

      // Also store in localStorage for web app
      localStorage.setItem("cg_uid", user.uid);
      localStorage.setItem("cg_plan", userData.plan || "free");

      setTimeout(() => {
        window.close();
      }, 1500);
    }

    // ── Sign In ──
    window.handleSignIn = async function() {
      const email    = document.getElementById("siEmail").value.trim();
      const password = document.getElementById("siPassword").value;
      if (!email || !password) return showError("Please fill in all fields.");
      setLoading("si", true);
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await handleAuthSuccess(cred.user);
      } catch (e) {
        showError(friendlyError(e.code));
        setLoading("si", false);
      }
    };

    // ── Sign Up ──
    window.handleSignUp = async function() {
      const email    = document.getElementById("suEmail").value.trim();
      const password = document.getElementById("suPassword").value;
      if (!email || !password) return showError("Please fill in all fields.");
      if (password.length < 8) return showError("Password must be at least 8 characters.");
      setLoading("su", true);
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await handleAuthSuccess(cred.user);
      } catch (e) {
        showError(friendlyError(e.code));
        setLoading("su", false);
      }
    };

    // ── Google Sign In ──
    window.handleGoogle = async function() {
      const provider = new GoogleAuthProvider();
      try {
        const cred = await signInWithPopup(auth, provider);
        await handleAuthSuccess(cred.user);
      } catch (e) {
        showError(friendlyError(e.code));
      }
    };

    // ── Tab switch ──
    window.switchTab = function(tab) {
      const isSignIn = tab === "signin";
      document.getElementById("signinForm").style.display = isSignIn ? "block" : "none";
      document.getElementById("signupForm").style.display = isSignIn ? "none" : "block";
      document.getElementById("tabSignIn").classList.toggle("active", isSignIn);
      document.getElementById("tabSignUp").classList.toggle("active", !isSignIn);
      hideMessages();
    };

    function setLoading(prefix, loading) {
      const btnId = prefix === "si" ? "btnSignIn" : "btnSignUp";
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.disabled = loading;
        btn.textContent = loading
          ? (prefix === "si" ? "Signing in..." : "Creating account...")
          : (prefix === "si" ? "Sign In" : "Create Account");
      }
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg; el.style.display = "block";
      document.getElementById("successMsg").style.display = "none";
    }

    function showSuccess(msg) {
      const el = document.getElementById("successMsg");
      el.textContent = msg; el.style.display = "block";
      document.getElementById("errorMsg").style.display = "none";
    }

    function hideMessages() {
      document.getElementById("errorMsg").style.display = "none";
      document.getElementById("successMsg").style.display = "none";
    }

    function friendlyError(code) {
      const map = {
        "auth/user-not-found": "No account found with this email.",
        "auth/wrong-password": "Incorrect password. Try again.",
        "auth/email-already-in-use": "An account with this email already exists.",
        "auth/weak-password": "Password is too weak. Use at least 8 characters.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/too-many-requests": "Too many attempts. Please wait a moment.",
        "auth/popup-closed-by-user": "Sign-in cancelled.",
      };
      return map[code] || "Something went wrong. Please try again.";
    }
  </script>
</body>
</html>
